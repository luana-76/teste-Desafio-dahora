<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 530" role="img" aria-labelledby="title desc">
<title id="title">Dahora, mascote do Desafio Dahora</title><desc id="desc">Robô branco e laranja com visor de vidro azul, reator luminoso no peito e propulsor, flutuando e acenando em uma plataforma holográfica.</desc>
<defs>
 <radialGradient id="bg"><stop stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#0a0f1e" stop-opacity="0"/></radialGradient>
 <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".35" stop-color="#f1f4fb"/><stop offset=".72" stop-color="#b7c4dd"/><stop offset="1" stop-color="#647394"/></linearGradient>
 <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd7b3"/><stop offset=".42" stop-color="#ff9a52"/><stop offset="1" stop-color="#a9430c"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#192b5d"/><stop offset="1" stop-color="#030817"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".35" stop-color="#a5f3fc"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
 <radialGradient id="core"><stop stop-color="#fff"/><stop offset=".3" stop-color="#a5f3fc"/><stop offset=".72" stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#16224f" stop-opacity=".96"/><stop offset="1" stop-color="#09132b" stop-opacity=".92"/></linearGradient>
 <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<style>
 .float{animation:float 3.2s ease-in-out infinite;transform-origin:340px 270px}.spin{transform-origin:340px 250px;animation:spin 24s linear infinite}.spin2{transform-origin:340px 250px;animation:spin 32s linear infinite reverse}.wave{transform-origin:431px 250px;animation:wave 1.25s ease-in-out infinite}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-in-out infinite}.flame{transform-origin:center top;animation:flame .42s ease-in-out infinite alternate}.panel{animation:panel 4s ease-in-out infinite}.panel2{animation:panel 4.6s ease-in-out infinite .7s}.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes wave{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(13deg)}}@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(1.35)}}@keyframes flame{from{transform:scaleY(.72)}to{transform:scaleY(1.25)}}@keyframes panel{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
